<!DOCTYPE html>
<html lang="sl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava · GitHub</title>
  <link rel="icon" type="image/png" href="images/httpsuxwing.comgithub-icon.png">
  <link rel="stylesheet" href="CSS/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <main class="authentication">
    <img src="images/github-white-icon.png" alt="GitHub logo" class="logo">

    <h1>Prijava v GitHub</h1>

    <form action="#" method="post" id="auth-form">
      <div class="form-group">
        <label for="username">Uporabniško ime ali e-pošta</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="form-group">
        <div class="password-label">
          <label for="password">Geslo</label>
          <a href="#" id="forgot-password">Pozabljeno geslo?</a>
        </div>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit">Prijava</button>
    </form>

    <div class="social-login">
      <div class="social-divider"><span>ali</span></div>

      <button type="button" class="social-button">
        <img src="//www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" alt="">
        Continue with Google
      </button>

      <button type="button" class="social-button">
        <img src="images/apple-xxl.png" alt="">
        Continue with Apple
      </button>
    </div>

    <p class="switch-text">
      Še nimaš računa? <a href="register.html">Ustvari račun</a>
    </p>

  </main>

  <footer class="page-credit">Created by Maks Rakuša</footer>

  <script>
    document.getElementById("forgot-password").onclick = event => event.preventDefault();
    document.getElementById("auth-form").onsubmit = event => {
      event.preventDefault();

      const success = document.getElementById("username").value.trim() === "student" &&
        document.getElementById("password").value === "Pass1234!";
      Swal.fire({
        icon: success ? "success" : "error",
        title: success ? "Login successful" : "Login failed"
      });
    };
  </script>
</body>

</html>
